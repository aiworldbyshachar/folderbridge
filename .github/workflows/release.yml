name: Release

# Push a tag like v1.0.0 to build the Windows installer and the Mac app and
# publish them as a GitHub release (the landing page links to the latest one).
# Run it by hand (Actions -> Release -> Run workflow) for a test build: the two
# installers are attached to the run as artifacts and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/FolderBridge-Windows-Setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      # One app for Apple Silicon and Intel, signed ad hoc (no paid certificate),
      # packed in a DMG with a shortcut to Applications.
      - run: npx electron-builder --mac dir --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: |
          APP="$(find dist -maxdepth 2 -name 'FolderBridge.app' -type d | head -n 1)"
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname FolderBridge -srcfolder dmg -ov -format UDZO dist/FolderBridge-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/FolderBridge-macOS.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
