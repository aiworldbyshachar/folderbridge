  <script>
    const tl = gsap.timeline({ paused: true });
    // Scene time = film time - 61.0
    const cam = (t, cx, cy, s, d, ease) =>
      tl.to("#t-stage", { x: 960 - cx * s, y: 540 - cy * s, scale: s, duration: d, ease: ease || "power2.inOut" }, t);
    const ROW = 54;

    gsap.set("#t-stage", { transformOrigin: "0 0", x: 960 - 1270 * 1.62, y: 540 - 390 * 1.62, scale: 1.62 });
    gsap.set(["#t-sheet", "#t-toast", "#t-keys", "#t-del", "#t-win", "#t-tag-pc"], { opacity: 0 });
    gsap.set("#t-list", { y: -ROW });
    gsap.set("#t-cursor", { x: 980, y: 560, opacity: 0 });

    // "Deleted something by mistake?": the photo goes on the Mac
    tl.set("#m-photo", { backgroundColor: "#d7e5fb" }, 0.05);
    tl.fromTo("#t-keys", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 0.1);
    tl.fromTo("#t-keys .key", { scale: 1 }, { scale: 0.94, y: 3, duration: 0.07, stagger: 0.05, ease: "power2.out" }, 0.32);
    tl.to("#t-keys .key", { scale: 1, y: 0, duration: 0.12, stagger: 0.05, ease: "power2.out" }, 0.42);
    tl.to("#m-photo", { opacity: 0, x: -12, duration: 0.18, ease: "power3.in" }, 0.45);
    tl.to("#m-after", { y: -34, duration: 0.35, ease: "expo.out" }, 0.6);
    tl.to("#t-keys", { opacity: 0, y: 24, duration: 0.22, ease: "power3.in" }, 0.95);

    // on the PC, FolderBridge shows where it went
    cam(1.1, 595, 410, 1.55, 0.7);
    tl.to(["#t-win", "#t-tag-pc"], { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.1);
    tl.to("#t-list", { y: 0, duration: 0.45, ease: "expo.out" }, 1.55);
