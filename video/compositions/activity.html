  <script>
    const tl = gsap.timeline({ paused: true });
    // Scene time = film time - 51.0
    const cam = (t, cx, cy, s, d, ease) =>
      tl.to("#a-stage", { x: 960 - cx * s, y: 540 - cy * s, scale: s, duration: d, ease: ease || "power2.inOut" }, t);
    const ROW = 54, FRESH = ["#r1", "#r2", "#r3", "#r4", "#r5", "#r6"];
    const BANNER = 128;

    gsap.set("#a-stage", { transformOrigin: "0 0", x: 960 - 960 * 1.6, y: 540 - 360 * 1.6, scale: 1.6 });
    gsap.set(["#a-warn", "#a-banner", "#a-toast", "#a-n2", "#a-c2", ...FRESH], { opacity: 0 });
    gsap.set("#a-list", { y: -ROW * FRESH.length });
    gsap.set("#a-cursor", { x: 1280, y: 780, opacity: 0 });

    // the window arrives
    // the pairing scene covers the first 0.35 s; the window is already there when it cuts
    tl.fromTo(["#a-win", "#a-tag"], { y: 24 }, { y: 0, duration: 0.5, ease: "expo.out" }, 0.35);

    // "You see every change": new rows drop in at the top, from both computers
    let y = -ROW * FRESH.length;
    const arrive = (id, t) => {
      y += ROW;
      tl.to("#a-list", { y, duration: 0.45, ease: "expo.out" }, t);
      tl.fromTo(id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, t + 0.08);
    };
    arrive("#r1", 0.94);
    arrive("#r2", 1.5);
    arrive("#r3", 2.05);
    arrive("#r4", 2.6);
    // "from both computers": who made each change
    tl.fromTo(".w-mac", { backgroundColor: "rgba(8,145,178,0)" }, { backgroundColor: "rgba(8,145,178,0.16)", duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, repeatDelay: 1.0 }, 2.35);
    tl.fromTo(".w-here", { backgroundColor: "rgba(85,80,216,0)" }, { backgroundColor: "rgba(85,80,216,0.16)", duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, repeatDelay: 1.0 }, 2.7);

    // "Edited the same file on both?": FolderBridge asks
    cam(4.25, 960, 300, 1.9, 0.7);
    arrive("#r5", 4.7);
    tl.fromTo("#a-warn", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.7);
    tl.to("#a-lower", { y: BANNER, duration: 0.45, ease: "expo.out" }, 4.7);
    tl.fromTo("#a-banner", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 4.8);
    // "keeps both versions"
    tl.fromTo("#a-safe", { backgroundColor: "rgba(255,226,140,0)" }, { backgroundColor: "rgba(255,226,140,1)", duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1, repeatDelay: 1.1 }, 7.39);

    // "and lets you choose": Keep both
    tl.set("#a-cursor", { x: 1180, y: 560 }, 8.55);
    tl.to("#a-cursor", { opacity: 1, duration: 0.12 }, 8.55);
    tl.to("#a-cursor", { x: 1066, y: 356, duration: 0.6, ease: "expo.out" }, 8.6);
    tl.to("#a-both", { scale: 0.95, duration: 0.07, yoyo: true, repeat: 1 }, 9.33);
    tl.to("#a-banner", { opacity: 0, duration: 0.18 }, 9.42);
    tl.to("#a-lower", { y: 0, duration: 0.45, ease: "expo.out" }, 9.45);
    tl.to("#a-warn", { opacity: 0, duration: 0.15 }, 9.42);
    tl.set(["#a-n1", "#a-c1"], { opacity: 0 }, 9.45);
    tl.set(["#a-n2", "#a-c2"], { opacity: 1 }, 9.45);
    arrive("#r6", 9.5);
    tl.fromTo("#a-toast", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, 9.45);
    tl.to("#a-cursor", { opacity: 0, duration: 0.2 }, 9.7);
    window.__timelines["activity"] = tl;
  </script>
