    tl.to("#d-mac-dim", { opacity: 0, duration: 0.35, ease: "power2.out" }, 3.5);
    tl.to("#d-pc-dim", { opacity: 0, duration: 0.35, ease: "power2.out" }, 4.93);

    tl.fromTo("#d-bin", { borderColor: "#c8c8d2" }, { borderColor: "#5550d8", duration: 0.3, yoyo: true, repeat: 3, ease: "power1.inOut" }, 9.0);

    tl.to("#d-card", { x: 582, scaleX: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 13.45);

    // ----- S3 (the detours overlay covers 15.2-24.0): what if both computers shared one folder? -----

    tl.to("#d-arm", { rotation: 181.08, duration: 0.75, ease: "power2.inOut" }, 27.06);
